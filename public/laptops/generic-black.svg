<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <!-- Generic Black Laptop -->
  <rect x="45" y="25" width="710" height="455" rx="16" fill="#1a1a1a"/>
  <rect x="55" y="35" width="690" height="435" rx="12" fill="#252525"/>

  <!-- Screen bezel -->
  <rect x="65" y="45" width="670" height="395" rx="8" fill="#0a0a0a"/>

  <!-- Screen -->
  <rect x="80" y="60" width="640" height="365" rx="4" fill="#171717"/>

  <!-- Camera -->
  <circle cx="400" cy="52" r="2.5" fill="#1a1a1a"/>

  <!-- Keyboard area -->
  <rect x="45" y="475" width="710" height="45" rx="8" fill="#2a2a2a"/>

  <!-- Subtle reflection -->
  <rect x="80" y="60" width="640" height="182" rx="4" fill="url(#blackGradient)" opacity="0.05"/>

  <defs>
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
