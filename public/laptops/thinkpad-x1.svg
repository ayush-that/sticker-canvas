<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <!-- Laptop Body - Classic ThinkPad black -->
  <rect x="35" y="20" width="730" height="470" rx="8" fill="#0f0f0f"/>
  <rect x="42" y="27" width="716" height="456" rx="6" fill="#1a1a1a"/>

  <!-- Screen bezel -->
  <rect x="50" y="35" width="700" height="410" rx="4" fill="#050505"/>

  <!-- Screen -->
  <rect x="60" y="45" width="680" height="390" rx="2" fill="#151515"/>

  <!-- Camera -->
  <circle cx="400" cy="40" r="2" fill="#222"/>

  <!-- Keyboard area -->
  <rect x="35" y="482" width="730" height="48" rx="4" fill="#1f1f1f"/>

  <!-- ThinkPad logo -->
  <text x="400" y="255" font-family="Arial" font-size="24" fill="#333" text-anchor="middle" opacity="0.6">ThinkPad</text>

  <!-- Red accent dot (TrackPoint homage) -->
  <circle cx="400" cy="280" r="6" fill="#c41230" opacity="0.7"/>

  <!-- Subtle texture -->
  <rect x="60" y="45" width="680" height="195" rx="2" fill="url(#thinkpadGradient)" opacity="0.03"/>

  <defs>
    <linearGradient id="thinkpadGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
