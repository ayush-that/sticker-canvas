<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <!-- Laptop Body -->
  <rect x="40" y="25" width="720" height="460" rx="12" fill="#1f1f1f"/>
  <rect x="48" y="33" width="704" height="444" rx="8" fill="#2d2d2d"/>

  <!-- Screen bezel - thin bezels -->
  <rect x="55" y="40" width="690" height="400" rx="6" fill="#0a0a0a"/>

  <!-- Screen -->
  <rect x="62" y="47" width="676" height="386" rx="3" fill="#1a1a1a"/>

  <!-- Camera -->
  <circle cx="400" cy="43" r="2" fill="#333"/>

  <!-- Keyboard area -->
  <rect x="40" y="477" width="720" height="48" rx="6" fill="#3d3d3d"/>

  <!-- Dell logo hint -->
  <text x="400" y="265" font-family="Arial" font-size="28" fill="#4a4a4a" text-anchor="middle" opacity="0.5">DELL</text>

  <!-- Carbon fiber texture hint -->
  <rect x="62" y="47" width="676" height="193" rx="3" fill="url(#dellGradient)" opacity="0.05"/>

  <defs>
    <linearGradient id="dellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
