<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <!-- Laptop Body - Silver -->
  <rect x="50" y="30" width="700" height="440" rx="18" fill="#c0c0c0"/>
  <rect x="58" y="38" width="684" height="424" rx="14" fill="#d8d8d8"/>

  <!-- Screen bezel -->
  <rect x="68" y="48" width="664" height="384" rx="8" fill="#1a1a1a"/>

  <!-- Screen -->
  <rect x="82" y="62" width="636" height="356" rx="4" fill="#252525"/>

  <!-- Camera notch -->
  <rect x="372" y="48" width="56" height="14" rx="4" fill="#1a1a1a"/>
  <circle cx="400" cy="55" r="2.5" fill="#333"/>

  <!-- Keyboard area -->
  <rect x="50" y="470" width="700" height="48" rx="6" fill="#e8e8e8"/>

  <!-- Apple logo -->
  <ellipse cx="400" cy="250" rx="32" ry="38" fill="#a0a0a0" opacity="0.4"/>

  <!-- Subtle gradient -->
  <rect x="82" y="62" width="636" height="178" rx="4" fill="url(#airReflection)" opacity="0.08"/>

  <defs>
    <linearGradient id="airReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
